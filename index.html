<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지각 탈출! 1등 자리 쟁탈전</title>
<style>
:root{--bg:#fff8ec;--card:#ffffff;--ink:#2b2a33;--mute:#7a7685;--line:#eadfca;--pri:#ff7a45;--pri2:#ffe3d3;--ok:#2fa36b;--gold:#ffc83d;--win:#cfe8ff;--door:#d9c2a0}
@media (prefers-color-scheme:dark){:root{--bg:#1d1b24;--card:#2a2733;--ink:#f3eff8;--mute:#a49fb2;--line:#3d3948;--pri:#ff8a5c;--pri2:#43302a;--ok:#4cc58a;--gold:#e0ac20;--win:#26405a;--door:#5a4a35}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{padding:14px 16px 6px;text-align:center}
h1{margin:0;font-size:1.4rem}
header p{margin:4px 0 0;color:var(--mute);font-size:.85rem}
nav{display:flex;gap:6px;padding:8px 12px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:1;padding:10px 2px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font-size:.9rem;font-weight:700;cursor:pointer}
nav button.on{background:var(--pri);border-color:var(--pri);color:#fff}
main{max-width:720px;margin:0 auto;padding:8px 12px 40px}
.box{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.hint{color:var(--mute);font-size:.85rem}
.live{color:#e0413a;font-weight:800;font-size:.8rem}
.big{width:100%;padding:26px 10px;font-size:1.5rem;font-weight:900;border:0;border-radius:18px;background:var(--pri);color:#fff;cursor:pointer;margin:6px 0 12px}
.me-done{text-align:center}
.me-done img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid var(--ok)}
.me-done .r{font-size:2rem;font-weight:900}
.btn{padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;cursor:pointer}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.r{color:#d33}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.pick button{padding:14px 4px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:1rem;cursor:pointer}
.tg{display:flex;gap:6px;margin-bottom:10px}
.tg button{flex:1;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;cursor:pointer}
.tg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rk{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px dashed var(--line)}
.rk:last-child{border:0}
.rk.me{background:var(--pri2);border-radius:10px}
.rk .n{min-width:34px;height:34px;border-radius:50%;background:var(--pri2);display:flex;align-items:center;justify-content:center;font-weight:900}
.rk:nth-child(1) .n{background:var(--gold);color:#3a2c00}
.rk .nm{flex:1;font-weight:700}
.rk .d5{color:var(--mute);font-size:.72rem}
.rk .sc{font-weight:900;font-size:1.05rem;min-width:42px;text-align:right}
.rk img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.x{border:0;background:none;color:#d33;font-size:1.1rem;cursor:pointer}
.turn{background:var(--pri2);border:2px solid var(--pri);border-radius:14px;padding:12px;text-align:center;font-weight:800;margin-bottom:12px}
.order{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{padding:4px 10px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-size:.8rem}
.chip.cur{border-color:var(--pri);background:var(--pri);color:#fff;font-weight:800}
.chip.fin{opacity:.5;text-decoration:line-through}
.room{display:grid;grid-template-columns:30px 1fr 30px;gap:6px}
.side{border-radius:10px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-weight:800;letter-spacing:.4em;font-size:.85rem}
.side.w{background:var(--win)}.side.d{background:var(--door)}
.board{background:#2f5d4a;color:#fff;text-align:center;padding:8px;border-radius:10px;font-weight:800;margin-bottom:6px;letter-spacing:.5em}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:start}
.col{display:flex;flex-direction:column;gap:6px}
.seat{min-height:60px;border-radius:10px;border:2px dashed var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:.8rem;text-align:center;padding:2px;color:var(--mute)}
.seat.can{cursor:pointer;border-color:var(--pri)}
.seat.taken{border-style:solid;border-color:var(--ok);font-weight:800;color:var(--ink)}
.seat.mine{background:var(--pri2);border-color:var(--pri)}
input,textarea{width:100%;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:10px;font:inherit}
textarea{height:220px}
label{display:block;margin:10px 0 4px;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1}
.wk{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.wk button:disabled{opacity:.35}
</style>
</head>
<body>
<header><h1>⏰ 지각 탈출! 1등 자리 쟁탈전</h1><p>일찍 올수록 높은 점수 → 점수 높은 순서대로 자리 선택!</p></header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="toast"></div>
<input type="file" id="file" accept="image/*" capture="user" hidden>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,collection,setDoc,deleteDoc,onSnapshot,serverTimestamp,runTransaction,writeBatch,getDocs,query,where,Timestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,onAuthStateChanged,signInAnonymously,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig={
  apiKey:"AIzaSyDjpPEPcOHUgBsoomPsXOhyMymNgft2oQg",
  authDomain:"get-up-early-f5687.firebaseapp.com",
  projectId:"get-up-early-f5687",
  storageBucket:"get-up-early-f5687.firebasestorage.app",
  messagingSenderId:"523180906022",
  appId:"1:523180906022:web:6e76d0a0e60ce6541178e7"
};

const COLS=[5,4,4,4];
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kst=ms=>new Date(ms+9*3600000).toISOString().slice(0,10);
const hm=ms=>new Date(ms+9*3600000).toISOString().slice(11,16);
const addDays=(d,n)=>new Date(Date.parse(d+'T00:00:00Z')+n*86400000).toISOString().slice(0,10);
const dow=d=>new Date(d+'T00:00:00Z').getUTCDay();
const dayName=d=>['일','월','화','수','목','금','토'][dow(d)];
const mondayOf=d=>addDays(d,-((dow(d)+6)%7));
const curWeek=()=>mondayOf(kst(Date.now()));
const md=d=>d.slice(5).replace('-','/');
const toast=m=>{const t=$('toast');t.textContent=m;t.className='on';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2600)};

const defNames=[];for(let i=1;i<=17;i++)defNames.push(i+'번');
let cfg={names:defNames,start:'',end:'',seat:{week:'',open:false}};
let rawW={},rawSeats={},subs={},vw=curWeek();
let me=localStorage.getItem('ontime-me');me=me===null?null:Number(me);
let tab='check',mode='cum',teacher=false,ready=false;
const N=()=>cfg.names.length;
const pts=r=>Math.max(N()+1-r,1);
const seatWeek=()=>(cfg.seat&&cfg.seat.week)||curWeek();
const seatOpen=()=>!!(cfg.seat&&cfg.seat.open);

const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app);
let fail='';
const err=e=>{console.error(e);fail=(e&&(e.code||e.message))||'unknown';if(!ready)render();toast(e&&e.code==='auth/operation-not-allowed'?'콘솔에서 로그인 방법(익명, 이메일)을 켜주세요':'연결/권한 오류! 설정과 규칙을 확인해주세요')};
let started=false;
render();
setTimeout(()=>{if(!ready){fail=fail||'시간 초과 (네트워크 확인)';render()}},8000);
onAuthStateChanged(auth,u=>{
  if(!u){signInAnonymously(auth).catch(err);return}
  teacher=!u.isAnonymous;ready=true;
  if(!started){started=true;
    onSnapshot(doc(db,'config','main'),s=>{if(s.exists())cfg={...cfg,...s.data()};render()},err);
    onSnapshot(collection(db,'seats'),s=>{rawSeats={};s.docs.forEach(d=>rawSeats[d.id]=d.data());render()},err);
  }
  render();
});
function ensureSub(w){
  if(subs[w])return;
  const a=Date.parse(w+'T00:00:00+09:00'),b=a+7*86400000;
  subs[w]=onSnapshot(query(collection(db,'checkins'),where('t','>=',Timestamp.fromMillis(a)),where('t','<',Timestamp.fromMillis(b))),
    s=>{rawW[w]=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'})}));render()},err);
}

function calc(w){
  const best={};
  (rawW[w]||[]).forEach(x=>{const t=x.t?x.t.toMillis():Date.now(),day=kst(t),k=x.s+'|'+day;
    if(!best[k]||t<best[k].t)best[k]={id:x.id,s:x.s,day,t,p:x.p}});
  const byDay={};Object.values(best).forEach(c=>(byDay[c.day]=byDay[c.day]||[]).push(c));
  const sc=cfg.names.map((n,i)=>({i,pts:0,cnt:0,days:{}}));
  Object.values(byDay).forEach(l=>{l.sort((a,b)=>a.t-b.t);l.forEach((c,r)=>{c.rank=r+1;c.pt=pts(r+1);if(sc[c.s]){sc[c.s].pts+=c.pt;sc[c.s].cnt++;sc[c.s].days[c.day]=c.rank}})});
  return {byDay,sc};
}
const order=P=>P.sc.slice().sort((a,b)=>b.pts-a.pts||b.cnt-a.cnt||a.i-b.i);

function nav(){
  const t=[['check','📸 인증'],['rank','🏆 순위'],['seat','🪑 자리'],['set','⚙️ 설정']];
  $('nav').innerHTML=t.map(x=>`<button class="${tab==x[0]?'on':''}" data-tab="${x[0]}">${x[1]}</button>`).join('');
}
function whoPicker(){
  return '<div class="box"><b>내 이름을 골라요</b><div class="hint" style="margin-bottom:8px">한 번만 고르면 돼요. 다른 친구 이름은 누르지 않기!</div><div class="pick">'+cfg.names.map((n,i)=>`<button data-me="${i}">${esc(n)}</button>`).join('')+'</div></div>';
}
function viewCheck(){
  if(me===null)return whoPicker();
  const P=calc(curWeek()),today=kst(Date.now()),list=(P.byDay[today]||[]).slice().sort((a,b)=>a.t-b.t);
  const mine=list.find(c=>c.s===me),sc=P.sc[me],rk=order(P).findIndex(s=>s.i===me)+1,wk=dow(today)%6===0;
  let h='<div class="box"><b>안녕, '+esc(cfg.names[me]||'?')+'!</b> <span class="live">● 실시간</span><div class="hint">이번 주 누적 '+(sc?sc.pts:0)+'점 · 전체 '+rk+'위</div></div>';
  if(mine)h+='<div class="box me-done"><img src="'+mine.p+'" alt=""><div class="r">오늘 '+mine.rank+'등! 🎉</div><div style="font-weight:800;color:var(--ok)">+'+mine.pt+'점</div><div class="hint">'+hm(mine.t)+' 인증 완료</div></div>';
  else if(wk)h+='<div class="box hint" style="text-align:center">주말에는 인증이 없어요. 월요일에 만나요!</div>';
  else{h+='<button class="big" data-act="snap">📸 인증하기</button>';
    if(cfg.start||cfg.end)h+='<div class="hint" style="text-align:center">인증 시간: '+(cfg.start||'')+' ~ '+(cfg.end||'')+'</div>'}
  h+='<div class="box"><b>오늘 도착한 친구들 ('+list.length+'/'+N()+')</b>';
  list.forEach(c=>{h+='<div class="rk'+(c.s===me?' me':'')+'"><div class="n">'+c.rank+'</div><img src="'+c.p+'" alt=""><div class="nm">'+esc(cfg.names[c.s]||'?')+'</div><div class="hint">'+hm(c.t)+'</div></div>'});
  if(!list.length)h+='<div class="hint">아직 아무도 안 왔어요. 1등의 주인공은?</div>';
  return h+'</div>';
}
function viewRank(){
  const cw=curWeek(),P=calc(vw),o=order(P),today=kst(Date.now()),days=[0,1,2,3,4].map(n=>addDays(vw,n)),m=vw===cw?mode:'cum';
  let h='<div class="wk"><button class="btn" data-wk="-1">◀</button><b>'+md(vw)+' ~ '+md(addDays(vw,4))+(vw===cw?' (이번 주)':'')+'</b><button class="btn" data-wk="1"'+(vw>=cw?' disabled':'')+'>▶</button></div>';
  if(vw===cw)h+='<div class="tg"><button data-mode="cum" class="'+(m=='cum'?'on':'')+'">누적 점수</button><button data-mode="day" class="'+(m=='day'?'on':'')+'">오늘 도착</button></div>';
  if(m=='cum'){
    h+='<div class="box"><b>🏆 주간 누적</b> <span class="live">● 실시간</span><div class="hint">1등 '+N()+'점 → 꼴등 1점 · 안 온 날 0점</div>';
    o.forEach((s,k)=>{h+='<div class="rk'+(s.i===me?' me':'')+'"><div class="n">'+(k+1)+'</div><div class="nm">'+esc(cfg.names[s.i])+'<div class="d5">'+days.map(d=>dayName(d)+(s.days[d]?s.days[d]:'-')).join(' ')+'</div></div><div class="sc">'+s.pts+'점</div></div>'});
    h+='</div>';
  }else{
    const list=(P.byDay[today]||[]).slice().sort((a,b)=>a.t-b.t),got={};list.forEach(c=>got[c.s]=1);
    h+='<div class="box"><b>오늘('+md(today)+') 도착 순서</b> <span class="live">● 실시간</span>';
    list.forEach(c=>{h+='<div class="rk'+(c.s===me?' me':'')+'"><div class="n">'+c.rank+'</div><img src="'+c.p+'" alt=""><div class="nm">'+esc(cfg.names[c.s]||'?')+'</div><div class="hint">'+hm(c.t)+' · +'+c.pt+'점</div>'+(teacher?'<button class="x" data-del="'+c.id+'">✕</button>':'')+'</div>'});
    if(!list.length)h+='<div class="hint">아직 아무도 안 왔어요.</div>';
    const wait=cfg.names.map((n,i)=>i).filter(i=>!got[i]);
    h+='</div><div class="box"><b>아직 안 온 친구</b><div class="hint">'+(wait.length?wait.map(i=>esc(cfg.names[i])).join(', '):'모두 도착!')+'</div></div>';
  }
  return h;
}
function viewSeat(){
  const sw=seatWeek(),P=calc(sw),o=order(P),seats={},owner={};
  for(const id in rawSeats)if(rawSeats[id].w===sw){seats[id]=rawSeats[id].s;owner[rawSeats[id].s]=id}
  const cur=o.find(s=>!(s.i in owner)),open=seatOpen();window._cur=cur;
  const can=open&&cur&&(teacher||me===cur.i);
  let h='<div class="hint" style="text-align:center;margin-bottom:8px">'+md(sw)+' 주 점수 기준</div>';
  if(!open)h+='<div class="turn">🔒 선생님이 자리 선택을 열면 시작해요<div class="hint">지금은 구경만 할 수 있어요</div></div>';
  else if(cur)h+='<div class="turn">👉 '+(o.indexOf(cur)+1)+'순위 <span style="font-size:1.25rem">'+esc(cfg.names[cur.i])+'</span> ('+cur.pts+'점) 차례!'+(can?'<div class="hint">원하는 빈 자리를 눌러요</div>':'')+'</div>';
  else h+='<div class="turn">🎉 모두 자리를 정했어요!</div>';
  h+='<div class="order">'+o.map((s,k)=>`<span class="chip ${open&&cur&&cur.i===s.i?'cur':((s.i in owner)?'fin':'')}">${k+1}. ${esc(cfg.names[s.i])} ${s.pts}점</span>`).join('')+'</div>';
  h+='<div class="board">칠 판</div><div class="room"><div class="side w">창 문</div><div class="cols">';
  COLS.forEach((n,c)=>{h+='<div class="col">';for(let r=0;r<n;r++){const id=c+'-'+r,w=seats[id];
    h+=w!==undefined?`<div class="seat taken${w===me?' mine':''}" data-rel="${id}">${esc(cfg.names[w]||'?')}</div>`:`<div class="seat${can?' can':''}" data-seat="${id}">${can?'선택':'빈 자리'}</div>`}
    h+='</div>'});
  return h+'</div><div class="side d">문</div></div><p class="hint">앞이 칠판, 왼쪽이 창문, 오른쪽이 문이에요. 실시간으로 바뀌어요.</p>';
}
function viewSet(){
  let h='<div class="box"><b>내 이름</b><div class="hint">'+(me===null?'아직 안 골랐어요':esc(cfg.names[me]||'?'))+'</div><div class="row" style="margin-top:8px"><button class="btn" data-act="changeme">이름 다시 고르기</button></div></div>';
  if(!teacher)return h+'<div class="box"><b>선생님 로그인</b><label>이메일</label><input id="em" type="email" autocomplete="username"><label>비밀번호</label><input id="pw" type="password" autocomplete="current-password"><div class="row" style="margin-top:8px"><button class="btn p" data-act="login">로그인</button></div></div>';
  const sw=seatWeek(),cw=curWeek();
  h+='<div class="box"><b>선생님 설정</b><label>학생 이름 (한 줄에 한 명, 17명)</label><textarea id="nm">'+esc(cfg.names.join('\n'))+'</textarea>';
  h+='<label>인증 가능 시각 (비우면 제한 없음)</label><div class="row"><input id="st" type="time" value="'+(cfg.start||'')+'" style="flex:1"> ~ <input id="en" type="time" value="'+(cfg.end||'')+'" style="flex:1"></div>';
  h+='<div class="row" style="margin-top:10px"><button class="btn p" data-act="savecfg">설정 저장</button></div></div>';
  h+='<div class="box"><b>자리 선택</b><div class="hint">'+(seatOpen()?'열려 있음 · '+md(sw)+' 주 점수 기준':'닫혀 있음')+'</div><div class="row" style="margin-top:8px">';
  h+='<button class="btn p" data-seatopen="'+cw+'">이번 주 점수로 열기</button><button class="btn p" data-seatopen="'+addDays(cw,-7)+'">지난 주 점수로 열기</button>';
  h+='<button class="btn" data-act="seatclose">닫기</button><button class="btn r" data-act="resetseats">자리 초기화</button></div></div>';
  h+='<div class="box"><b>로그아웃</b><div class="row" style="margin-top:8px"><button class="btn" data-act="logout">선생님 로그아웃</button></div><div class="hint" style="margin-top:6px">주는 월요일마다 자동으로 새로 시작하고, 지난 주 기록은 순위 탭 ◀로 볼 수 있어요.</div></div>';
  return h;
}
function render(){
  const a=document.activeElement;if(a&&(a.tagName=='INPUT'||a.tagName=='TEXTAREA')&&a.type!='file')return;
  nav();
  if(!ready){$('app').innerHTML=fail?'<div class="box"><b>연결에 실패했어요</b><div class="hint" style="margin-top:6px">오류: '+esc(fail)+'</div><div class="hint" style="margin-top:6px">① Firebase 콘솔 Authentication에서 익명 로그인 켜기 ② 파일을 더블클릭하지 말고 https 주소(Firebase Hosting)로 열기</div></div>':'<div class="box hint">연결 중…</div>';return}
  ensureSub(curWeek());ensureSub(vw);ensureSub(seatWeek());
  $('app').innerHTML=tab=='check'?viewCheck():tab=='rank'?viewRank():tab=='seat'?(me===null&&!teacher?whoPicker():viewSeat()):viewSet();
}

async function wipe(c){const s=await getDocs(collection(db,c));const b=writeBatch(db);s.docs.forEach(d=>b.delete(d.ref));await b.commit()}
async function submitPhoto(f){
  const today=kst(Date.now()),nowMin=hm(Date.now());
  if(dow(today)%6===0)return toast('주말에는 인증할 수 없어요');
  if(cfg.start&&nowMin<cfg.start)return toast('아직 인증 시간이 아니에요 ('+cfg.start+'부터)');
  if(cfg.end&&nowMin>cfg.end)return toast('인증 시간이 지났어요');
  const url=await new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
    const s=200,c=document.createElement('canvas');c.width=c.height=s;const m=Math.min(im.width,im.height);
    c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);res(c.toDataURL('image/jpeg',.6))};im.src=r.result};r.readAsDataURL(f)});
  const ref=doc(db,'checkins',today+'_'+me);
  try{
    await runTransaction(db,async tx=>{const s=await tx.get(ref);if(s.exists())throw new Error('dup');tx.set(ref,{s:me,p:url,t:serverTimestamp()})});
    toast('인증 완료! 🎉');
  }catch(e){console.error(e);toast(e.message=='dup'?'오늘은 이미 인증했어요':'전송 실패, 다시 시도해주세요')}
}
async function pickSeat(id){
  const c=window._cur,sw=seatWeek();if(!c)return;
  if(!confirm(cfg.names[c.i]+' 학생, 이 자리로 정할까요?'))return;
  const ref=doc(db,'seats',id);
  try{await runTransaction(db,async tx=>{const s=await tx.get(ref);if(s.exists()&&s.data().w===sw)throw new Error('taken');tx.set(ref,{s:c.i,w:sw,t:serverTimestamp()})});toast('자리 선택 완료!')}
  catch(e){console.error(e);toast(e.message=='taken'?'앗, 방금 다른 친구가 골랐어요':'실패, 다시 시도해주세요')}
}
$('file').addEventListener('change',e=>{const f=e.target.files[0];if(f&&me!==null)submitPhoto(f);e.target.value=''});

document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-seat],[data-rel]');if(!t||t.disabled)return;const d=t.dataset;
  if(d.tab){tab=d.tab;render();return}
  if(d.mode){mode=d.mode;render();return}
  if(d.wk){vw=addDays(vw,7*Number(d.wk));if(vw>curWeek())vw=curWeek();render();return}
  if(d.me!==undefined){me=Number(d.me);localStorage.setItem('ontime-me',me);render();return}
  if(d.seat){if(t.classList.contains('can'))pickSeat(d.seat);return}
  if(d.rel){if(teacher&&confirm('이 자리를 비울까요?'))deleteDoc(doc(db,'seats',d.rel)).catch(err);return}
  if(d.del){if(confirm('이 인증을 취소할까요? (뒤 순위가 당겨져요)'))deleteDoc(doc(db,'checkins',d.del)).catch(err);return}
  if(d.seatopen){setDoc(doc(db,'config','main'),{seat:{week:d.seatopen,open:true}},{merge:true}).then(()=>toast('자리 선택을 열었어요')).catch(err);return}
  const a=d.act;if(!a)return;
  if(a=='snap')$('file').click();
  else if(a=='changeme'){me=null;localStorage.removeItem('ontime-me');tab='check';render()}
  else if(a=='login'){signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value).then(()=>toast('선생님으로 로그인했어요')).catch(()=>toast('이메일/비밀번호가 달라요'))}
  else if(a=='logout'){signOut(auth)}
  else if(a=='savecfg'){
    const names=$('nm').value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(names.length!=17)return toast('17명을 입력해주세요 (지금 '+names.length+'명)');
    setDoc(doc(db,'config','main'),{names,start:$('st').value||'',end:$('en').value||''},{merge:true}).then(()=>toast('저장했어요')).catch(err);
  }
  else if(a=='seatclose'){setDoc(doc(db,'config','main'),{seat:{week:seatWeek(),open:false}},{merge:true}).then(()=>toast('자리 선택을 닫았어요')).catch(err)}
  else if(a=='resetseats'){if(confirm('자리를 모두 지울까요?'))wipe('seats').catch(err)}
});
</script>
