<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지각 탈출! 1등 자리 쟁탈전</title>
<style>
:root{--bg:#fff8ec;--card:#ffffff;--ink:#2b2a33;--mute:#7a7685;--line:#eadfca;--pri:#ff7a45;--pri2:#ffe3d3;--ok:#2fa36b;--gold:#ffc83d;--win:#cfe8ff;--door:#d9c2a0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b24;--card:#2a2733;--ink:#f3eff8;--mute:#a49fb2;--line:#3d3948;--pri:#ff8a5c;--pri2:#43302a;--ok:#4cc58a;--gold:#e0ac20;--win:#26405a;--door:#5a4a35}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.45}
header{padding:16px 16px 8px;text-align:center}
h1{margin:0;font-size:1.5rem}
header p{margin:4px 0 0;color:var(--mute);font-size:.9rem}
nav{display:flex;gap:6px;padding:8px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:1;padding:10px 4px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer}
nav button.on{background:var(--pri);border-color:var(--pri);color:#fff}
main{max-width:900px;margin:0 auto;padding:8px 12px 40px}
.days{display:flex;gap:6px;margin-bottom:12px}
.days button{flex:1;padding:8px 0;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;cursor:pointer}
.days button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.st{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;position:relative;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.st.done{border-color:var(--ok);cursor:default}
.st img{width:72px;height:72px;object-fit:cover;border-radius:50%;border:3px solid var(--ok)}
.st .nm{font-weight:800}
.st .cam{font-size:2rem}
.badge{position:absolute;top:-8px;left:-8px;background:var(--gold);color:#3a2c00;font-weight:900;border-radius:999px;min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.pt{color:var(--ok);font-weight:800;font-size:.9rem}
.x{position:absolute;top:4px;right:6px;border:0;background:none;color:var(--mute);font-size:1.1rem;cursor:pointer}
.box{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.rk{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px dashed var(--line)}
.rk:last-child{border:0}
.rk .n{width:34px;height:34px;border-radius:50%;background:var(--pri2);display:flex;align-items:center;justify-content:center;font-weight:900}
.rk:nth-child(1) .n{background:var(--gold)}
.rk .nm{flex:1;font-weight:700}
.rk .days5{color:var(--mute);font-size:.8rem}
.rk .sc{font-weight:900;font-size:1.1rem}
.bar{height:8px;background:var(--pri2);border-radius:6px;overflow:hidden;flex:1.2}
.bar i{display:block;height:100%;background:var(--pri)}
.turn{background:var(--pri2);border:2px solid var(--pri);border-radius:14px;padding:12px;text-align:center;font-weight:800;margin-bottom:12px}
.order{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{padding:4px 10px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-size:.85rem}
.chip.cur{border-color:var(--pri);background:var(--pri);color:#fff;font-weight:800}
.chip.fin{opacity:.5;text-decoration:line-through}
.room{display:grid;grid-template-columns:34px 1fr 34px;gap:6px}
.side{border-radius:10px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-weight:800;letter-spacing:.4em;font-size:.9rem}
.side.w{background:var(--win)}.side.d{background:var(--door)}
.board{background:#2f5d4a;color:#fff;text-align:center;padding:8px;border-radius:10px;font-weight:800;margin-bottom:6px;letter-spacing:.5em}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:start}
.col{display:flex;flex-direction:column;gap:8px}
.seat{min-height:62px;border-radius:10px;border:2px dashed var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.85rem;cursor:pointer;padding:2px;text-align:center}
.seat small{color:var(--mute);font-size:.7rem}
.seat.free:hover{border-color:var(--pri);background:var(--pri2)}
.seat.taken{border-style:solid;border-color:var(--ok);font-weight:800}
.seat.mine{background:var(--pri2);border-color:var(--pri)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;cursor:pointer}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.r{color:#d33}
textarea{width:100%;height:240px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:10px;font:inherit}
.hint{color:var(--mute);font-size:.85rem}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#toast.on{opacity:1}
</style>
</head>
<body>
<header><h1>⏰ 지각 탈출! 1등 자리 쟁탈전</h1><p>일찍 올수록 높은 점수 → 높은 점수일수록 먼저 자리 선택!</p></header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="toast"></div>
<input type="file" id="file" accept="image/*" capture="user" hidden>
<script>
var DAYS=['월','화','수','목','금'];
var D={names:[],checks:[[],[],[],[],[]],seats:{}};
var tab='check',day=0,pending=null;
function load(){try{var s=localStorage.getItem('ontime-v1');if(s)D=JSON.parse(s)}catch(e){}
 if(!D.names||!D.names.length){D.names=[];for(var i=1;i<=17;i++)D.names.push(i+'번')}
 if(!D.checks)D.checks=[[],[],[],[],[]];if(!D.seats)D.seats={}}
function save(){try{localStorage.setItem('ontime-v1',JSON.stringify(D))}catch(e){toast('저장 공간이 부족해요. 사진을 줄여주세요')}}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='on';setTimeout(function(){t.className=''},2200)}
function N(){return D.names.length}
function pts(rank){return Math.max(N()+1-rank,1)}
function scores(){var s=D.names.map(function(n,i){return {i:i,pts:0,cnt:0,days:[]}});
 D.checks.forEach(function(list,d){list.forEach(function(c,r){var p=pts(r+1);s[c.s].pts+=p;s[c.s].cnt++;s[c.s].days[d]=r+1})});return s}
function order(){return scores().sort(function(a,b){return b.pts-a.pts||b.cnt-a.cnt||a.i-b.i})}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function renderNav(){var t=[['check','📸 출석 인증'],['rank','🏆 순위'],['seat','🪑 자리 정하기'],['set','⚙️ 설정']];
 document.getElementById('nav').innerHTML=t.map(function(x){return '<button class="'+(tab==x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')}
function go(t){tab=t;render()}
function dayBar(){return '<div class="days">'+DAYS.map(function(d,i){return '<button class="'+(i==day?'on':'')+'" onclick="day='+i+';render()">'+d+'</button>'}).join('')+'</div>'}

function viewCheck(){var list=D.checks[day],h=dayBar();
 h+='<p class="hint">이름 카드를 누르고 셀카를 찍으면 인증 완료! 지금까지 '+list.length+'/'+N()+'명 도착</p><div class="grid">';
 var done={};list.forEach(function(c,r){done[c.s]=r});
 // arrived first in order, then waiting
 list.forEach(function(c,r){h+='<div class="st done"><div class="badge">'+(r+1)+'등</div><button class="x" title="취소" onclick="undo('+c.s+')">✕</button><img src="'+c.p+'" alt=""><div class="nm">'+esc(D.names[c.s])+'</div><div class="pt">+'+pts(r+1)+'점</div></div>'});
 D.names.forEach(function(n,i){if(done[i]===undefined)h+='<div class="st" onclick="snap('+i+')"><div class="cam">📷</div><div class="nm">'+esc(n)+'</div><div class="hint">아직 안 왔어요</div></div>'});
 return h+'</div>'}
function snap(i){pending=i;var f=document.getElementById('file');f.value='';f.click()}
document.addEventListener('DOMContentLoaded',function(){document.getElementById('file').addEventListener('change',function(e){
 var f=e.target.files[0];if(!f||pending===null)return;var i=pending;pending=null;
 var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
  var s=200,c=document.createElement('canvas');c.width=c.height=s;var x=c.getContext('2d');
  var m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);
  D.checks[day].push({s:i,p:c.toDataURL('image/jpeg',.6),t:Date.now()});save();
  toast(D.names[i]+' '+D.checks[day].length+'등! +'+pts(D.checks[day].length)+'점 🎉');render()};im.src=r.result};r.readAsDataURL(f)})});
function undo(i){if(!confirm(D.names[i]+' 인증을 취소할까요? (뒤 순번이 한 칸씩 당겨져요)'))return;
 D.checks[day]=D.checks[day].filter(function(c){return c.s!=i});save();render()}

function viewRank(){var o=order(),max=o[0]&&o[0].pts||1;
 var h='<div class="box"><b>이번 주 누적 점수</b><div class="hint">1등 '+N()+'점 → 꼴등 1점 · 안 온 날은 0점</div>';
 o.forEach(function(s,k){h+='<div class="rk"><div class="n">'+(k+1)+'</div><div class="nm">'+esc(D.names[s.i])+'</div><div class="days5">'+DAYS.map(function(d,j){return d+(s.days[j]?s.days[j]:'-')}).join(' ')+'</div><div class="bar"><i style="width:'+(s.pts/max*100)+'%"></i></div><div class="sc">'+s.pts+'점</div></div>'});
 return h+'</div><p class="hint">요일 옆 숫자는 그날 도착 등수예요. 동점이면 인증을 더 많이 한 친구가 먼저예요.</p>'}

// seats: columns left to right (window -> door). col0 has 5 desks, others 4.
var COLS=[5,4,4,4];
function sid(c,r){return c+'-'+r}
function viewSeat(){var o=order(),owner={};
 for(var k in D.seats)owner[D.seats[k]]=k;
 var cur=null;for(var a=0;a<o.length;a++){if(!owner[o[a].i]){cur=o[a];break}}
 var h='';
 if(cur)h+='<div class="turn">👉 '+(order().indexOf(cur)+1)+'순위 <span style="font-size:1.3rem">'+esc(D.names[cur.i])+'</span> ('+cur.pts+'점) 차례! 원하는 자리를 눌러요</div>';
 else h+='<div class="turn">🎉 모두 자리를 정했어요!</div>';
 h+='<div class="order">'+o.map(function(s,k){var c=cur&&cur.i==s.i?'cur':(owner[s.i]?'fin':'');return '<span class="chip '+c+'">'+(k+1)+'. '+esc(D.names[s.i])+' '+s.pts+'점</span>'}).join('')+'</div>';
 h+='<div class="board">칠 판</div><div class="room"><div class="side w">창 문</div><div class="cols">';
 COLS.forEach(function(n,c){h+='<div class="col">';for(var r=0;r<n;r++){var id=sid(c,r),w=D.seats[id];
  h+=w!==undefined?'<div class="seat taken" onclick="rel(\''+id+'\')">'+esc(D.names[w])+'</div>':'<div class="seat free" onclick="pick(\''+id+'\')"><small>빈 자리</small></div>'}
  h+='</div>'});
 h+='</div><div class="side d">문</div></div><div class="row" style="margin-top:12px"><button class="btn r" onclick="resetSeats()">자리 전체 초기화</button></div>';
 h+='<p class="hint">자리 배치는 학생 시선 기준(앞이 칠판, 왼쪽 창문, 오른쪽 문)이에요. 자리를 잘못 골랐다면 그 자리를 눌러 취소할 수 있어요.</p>';
 window._cur=cur;return h}
function pick(id){var c=window._cur;if(!c){toast('모두 자리를 정했어요');return}
 if(!confirm(D.names[c.i]+' 학생, 이 자리로 정할까요?'))return;D.seats[id]=c.i;save();render()}
function rel(id){if(!confirm(D.names[D.seats[id]]+' 자리를 취소할까요?'))return;delete D.seats[id];save();render()}
function resetSeats(){if(confirm('자리 정한 것을 모두 지울까요?')){D.seats={};save();render()}}

function viewSet(){return '<div class="box"><b>학생 이름 (한 줄에 한 명)</b><div class="hint">자리가 17개라 17명 기준이에요. 이름을 바꾸면 기록은 같은 번호 칸에 이어져요.</div><textarea id="nm">'+esc(D.names.join('\n'))+'</textarea><div class="row" style="margin-top:8px"><button class="btn p" onclick="saveNames()">이름 저장</button></div></div>'
 +'<div class="box"><b>새 주간 시작</b><div class="hint">출석 사진과 자리를 모두 지워요.</div><div class="row" style="margin-top:8px"><button class="btn r" onclick="resetAll()">전부 초기화</button></div></div>'}
function saveNames(){var a=document.getElementById('nm').value.split('\n').map(function(s){return s.trim()}).filter(Boolean);
 if(a.length!=17){toast('17명을 입력해주세요 (지금 '+a.length+'명)');return}D.names=a;save();toast('저장했어요');render()}
function resetAll(){if(confirm('정말 모든 기록을 지울까요?')){D.checks=[[],[],[],[],[]];D.seats={};save();render()}}

function render(){renderNav();var a=document.getElementById('app');
 a.innerHTML=tab=='check'?viewCheck():tab=='rank'?viewRank():tab=='seat'?viewSeat():viewSet()}
load();var wd=new Date().getDay();day=wd>=1&&wd<=5?wd-1:0;render();
</script>
</body>
</html>
